services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oes
      POSTGRES_PASSWORD: oes
      POSTGRES_USER: oes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oes -d oes"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - oes_postgres_data:/var/lib/postgresql/data

volumes:
  oes_postgres_data:
