name: Final one-shot branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          failures=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "Failed to delete branch: $branch" >&2
              failures=$((failures + 1))
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "$failures branch deletion(s) failed" >&2
            exit 1
          fi

      - name: Verify only main remains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t remaining < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf 'Remaining branches:\n'
          printf '%s\n' "${remaining[@]}"
          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "main" ]]; then
            echo "Branch cleanup did not converge to main only" >&2
            exit 1
          fi

      - name: Mark repository consolidation complete in ROADMAP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          roadmap_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/ROADMAP.md?ref=main" --jq '.sha')"
          roadmap_content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/ROADMAP.md?ref=main" --jq -r '.content' | tr -d '\n' | base64 --decode)"
          roadmap_content="${roadmap_content//├── [~] Incorporar \`AGENTS.md\` y cierre documental final/├── [x] Incorporar \`AGENTS.md\` y cierre documental final}"
          roadmap_content="${roadmap_content//├── [ ] Eliminar ramas feature\/refactor ya fusionadas mediante mantenimiento one-shot/├── [x] Eliminar ramas feature\/refactor ya fusionadas mediante mantenimiento one-shot}"
          encoded="$(printf '%s' "$roadmap_content" | base64 -w0)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ROADMAP.md" \
            --field message='docs(roadmap): record final branch cleanup' \
            --field content="$encoded" \
            --field sha="$roadmap_sha" \
            --field branch='main'

      - name: Remove this one-shot workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          file_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/branch-cleanup.yml?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/branch-cleanup.yml" \
            --field message='chore(repo): remove final one-shot branch cleanup workflow' \
            --field sha="$file_sha" \
            --field branch='main'
