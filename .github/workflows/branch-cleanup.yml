name: One-shot branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          failures=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "Failed to delete branch: $branch" >&2
              failures=$((failures + 1))
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "$failures branch deletion(s) failed" >&2
            exit 1
          fi

      - name: Verify only main remains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t remaining < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf 'Remaining branches:\n'
          printf '%s\n' "${remaining[@]}"
          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "main" ]]; then
            echo "Branch cleanup did not converge to main only" >&2
            exit 1
          fi

      - name: Remove this one-shot workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          file_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/branch-cleanup.yml?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/branch-cleanup.yml" \
            --field message='chore(repo): remove one-shot branch cleanup workflow' \
            --field sha="$file_sha" \
            --field branch='main'
