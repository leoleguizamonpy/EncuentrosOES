name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-delegation:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/competition-store-delegation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/competition-store-delegation
          fetch-depth: 0
      - name: Apply exact delegation and remove temporary infrastructure
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/competitions/prisma-competition-store.ts')
          text = path.read_text()
          old_import = "import { type Prisma, type PrismaClient } from '@oes/database';"
          new_import = "import { PrismaCompetitionRepository, type Prisma, type PrismaClient } from '@oes/database';"
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_ctor = "export class PrismaCompetitionStore implements CompetitionStore {\n  public constructor(@Inject(PRISMA_CLIENT) private readonly client: PrismaClient) {}"
          new_ctor = "export class PrismaCompetitionStore implements CompetitionStore {\n  readonly #competitionRepository: PrismaCompetitionRepository;\n\n  public constructor(@Inject(PRISMA_CLIENT) private readonly client: PrismaClient) {\n    this.#competitionRepository = new PrismaCompetitionRepository(client);\n  }"
          assert old_ctor in text
          text = text.replace(old_ctor, new_ctor, 1)

          old_add_write = """        const snapshot = aggregate.toSnapshot();
        const updated = await transaction.competition.updateMany({
          data: {
            formatCode: snapshot.formatCode,
            groupCount: snapshot.groupCount,
            revision: snapshot.revision,
            updatedAt: snapshot.updatedAt,
            updatedById: snapshot.updatedBy,
          },
          where: { id: snapshot.id, revision: input.expectedRevision },
        });
        if (updated.count !== 1) {
          throw new CompetitionStoreError('CONCURRENCY_CONFLICT', 'The competition was modified by another operation.');
        }
        const participant = snapshot.participants.find(({ id }) => id === participantId);
        if (participant === undefined) throw new Error('Participant mutation did not produce a snapshot.');
        await transaction.competitionParticipant.create({
          data: {
            competitionId: snapshot.id,
            displayName: participant.displayName,
            enabledAt: participant.enabledAt,
            enabledById: participant.enabledBy,
            eventId: participant.eventId,
            id: participant.id,
            institutionId: participant.institutionId,
            revision: participant.revision,
            status: participant.status,
          },
        });
"""
          new_add_write = """        try {
          await this.#competitionRepository.saveInTransaction(
            transaction,
            aggregate,
            input.expectedRevision,
          );
        } catch (error: unknown) {
          if (error instanceof DomainError) throw storeError(error);
          throw error;
        }
        const snapshot = aggregate.toSnapshot();
"""
          assert old_add_write in text
          text = text.replace(old_add_write, new_add_write, 1)

          old_format_write = """        const snapshot = aggregate.toSnapshot();
        const updated = await transaction.competition.updateMany({
          data: {
            formatCode: snapshot.formatCode,
            groupCount: snapshot.groupCount,
            revision: snapshot.revision,
            updatedAt: snapshot.updatedAt,
            updatedById: snapshot.updatedBy,
          },
          where: { id: snapshot.id, revision: input.expectedRevision },
        });
        if (updated.count !== 1) {
          throw new CompetitionStoreError('CONCURRENCY_CONFLICT', 'The competition was modified by another operation.');
        }
"""
          new_format_write = """        try {
          await this.#competitionRepository.saveInTransaction(
            transaction,
            aggregate,
            input.expectedRevision,
          );
        } catch (error: unknown) {
          if (error instanceof DomainError) throw storeError(error);
          throw error;
        }
        const snapshot = aggregate.toSnapshot();
"""
          assert old_format_write in text
          text = text.replace(old_format_write, new_format_write, 1)

          start = text.index('  async #aggregate(transaction: Prisma.TransactionClient, id: string): Promise<Competition> {')
          end = text.index('\n\n  async #detail(', start)
          replacement = """  async #aggregate(transaction: Prisma.TransactionClient, id: string): Promise<Competition> {
    const aggregate = await this.#competitionRepository.findByIdInTransaction(transaction, id);
    if (aggregate === null) {
      throw new CompetitionStoreError('COMPETITION_NOT_FOUND', 'The competition does not exist.');
    }
    return aggregate;
  }"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/one-shot-competition-store-delegation.yml
          rm -f docs/.keep-competition-store-delegation docs/.delegation-pr-marker
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/src/competitions/prisma-competition-store.ts .github/workflows/ci.yml
          git add -u -- .github/workflows/one-shot-competition-store-delegation.yml docs/.keep-competition-store-delegation docs/.delegation-pr-marker
          git commit -m "refactor(api): delegate competition aggregate persistence"
          git push origin HEAD:refactor/competition-store-delegation

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://oes:oes@localhost:5432/oes?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oes
          POSTGRES_PASSWORD: oes
          POSTGRES_USER: oes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oes -d oes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: git diff --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate database schema
        run: pnpm db:validate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Test PostgreSQL integration
        run: pnpm test:integration

      - name: Seed backup restore sentinel
        shell: bash
        run: |
          LIBPQ_URL="${DATABASE_URL%%\?*}"
          docker run --rm --network host postgres:17-alpine \
            psql "$LIBPQ_URL" --set=ON_ERROR_STOP=1 \
            --command="CREATE TABLE IF NOT EXISTS backup_restore_sentinel (id text PRIMARY KEY, created_at timestamptz NOT NULL DEFAULT now()); INSERT INTO backup_restore_sentinel (id) VALUES ('backup-drill') ON CONFLICT (id) DO NOTHING;"

      - name: Create verifiable PostgreSQL backup
        run: pnpm db:backup -- ./artifacts/database/ci.dump

      - name: Restore backup into isolated database
        run: pnpm db:restore:drill -- ./artifacts/database/ci.dump

      - name: Exercise external backup roundtrip contract
        shell: bash
        env:
          BACKUP_FAKE_REMOTE_DIR: ${{ github.workspace }}/artifacts/fake-remote
          BACKUP_ID: ci-external-backup
          BACKUP_OUTPUT_DIR: ${{ github.workspace }}/artifacts/database/external
          BACKUP_REMOTE_PREFIX: oes-production
          BACKUP_REMOTE_RESTORE_DIR: ${{ github.workspace }}/artifacts/database/remote-restore
          BACKUP_RETENTION_DAYS: '30'
          BACKUP_TRANSPORT_EXECUTABLE: ${{ github.workspace }}/scripts/database/test/fake-backup-transport.sh
        run: |
          chmod +x "$BACKUP_TRANSPORT_EXECUTABLE"
          pnpm db:backup:roundtrip-drill
          test "$(wc -l < "$BACKUP_FAKE_REMOTE_DIR/uploads.log")" -eq 3
          test "$(wc -l < "$BACKUP_FAKE_REMOTE_DIR/downloads.log")" -eq 3
          grep -Fx 'oes-production 30' "$BACKUP_FAKE_REMOTE_DIR/retention.log"
          test -f "$BACKUP_FAKE_REMOTE_DIR/oes-production/ci-external-backup.dump"
          test -f "$BACKUP_FAKE_REMOTE_DIR/oes-production/ci-external-backup.dump.sha256"
          MANIFEST="$BACKUP_FAKE_REMOTE_DIR/oes-production/ci-external-backup.manifest.json"
          test -f "$MANIFEST"
          grep -F '"schemaVersion": "oes-backup-manifest-v1"' "$MANIFEST"
          grep -F '"retentionDays": 30' "$MANIFEST"
          ! grep -F 'DATABASE_URL' "$MANIFEST"
          ! grep -F 'localhost' "$MANIFEST"
          (cd "$(dirname "$MANIFEST")" && sha256sum --check ci-external-backup.dump.sha256)

      - name: Test with coverage
        run: pnpm coverage

      - name: Build
        run: pnpm build

  visual-e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://oes:oes@localhost:5432/oes?schema=public
      E2E_SCREENSHOT_DIR: artifacts/visual-e2e
      E2E_SUPERADMIN_EMAIL: e2e-superadmin@oes.test
      E2E_SUPERADMIN_PASSWORD: e2e-superadmin-password-2026
      E2E_WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oes
          POSTGRES_PASSWORD: oes
          POSTGRES_USER: oes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oes -d oes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare E2E environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://oes:oes@localhost:5432/oes?schema=public
          API_PORT=3001
          SESSION_ABSOLUTE_MINUTES=720
          SESSION_IDLE_MINUTES=30
          WEB_ORIGIN=http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/api/v1
          EOF
          pnpm db:migrate:deploy

      - name: Bootstrap E2E superadmin
        env:
          OES_BOOTSTRAP_DISPLAY_NAME: E2E Superadmin
          OES_BOOTSTRAP_EMAIL: e2e-superadmin@oes.test
          OES_BOOTSTRAP_PASSWORD: e2e-superadmin-password-2026
        run: pnpm --filter @oes/api bootstrap:superadmin

      - name: Build application for browser drill
        run: pnpm build

      - name: Install pinned browser runner
        shell: bash
        run: |
          pnpm add -Dw --lockfile=false --ignore-scripts playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start API and web
        shell: bash
        run: |
          pnpm --filter @oes/api start > /tmp/oes-api.log 2>&1 &
          echo $! > /tmp/oes-api.pid
          pnpm --filter @oes/web start > /tmp/oes-web.log 2>&1 &
          echo $! > /tmp/oes-web.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null && curl --silent http://127.0.0.1:3001/api/v1/auth/me > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oes-api.log
          cat /tmp/oes-web.log
          exit 1

      - name: Exercise responsive workspace in Chromium
        run: node .github/e2e/admin-responsive.mjs

      - name: Upload visual E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: visual-e2e-screenshots
          path: artifacts/visual-e2e

      - name: Stop API and web
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/oes-api.pid || kill "$(cat /tmp/oes-api.pid)" 2>/dev/null || true
          test ! -f /tmp/oes-web.pid || kill "$(cat /tmp/oes-web.pid)" 2>/dev/null || true
