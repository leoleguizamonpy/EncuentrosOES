name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://oes:oes@localhost:5432/oes?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oes
          POSTGRES_PASSWORD: oes
          POSTGRES_USER: oes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oes -d oes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: git diff --check

      - name: Architecture gate
        run: pnpm architecture:check

      - name: UI architecture gate
        run: pnpm architecture:ui

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate database schema
        run: pnpm db:validate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Test PostgreSQL integration
        run: pnpm test:integration

      - name: Test REAL-STORAGE-DRILL local guards
        run: pnpm db:backup:real-storage-guards

      - name: Seed backup restore sentinel
        shell: bash
        run: |
          LIBPQ_URL="${DATABASE_URL%%\?*}"
          docker run --rm --network host postgres:17-alpine \
            psql "$LIBPQ_URL" --set=ON_ERROR_STOP=1 \
            --command="CREATE TABLE IF NOT EXISTS backup_restore_sentinel (id text PRIMARY KEY, created_at timestamptz NOT NULL DEFAULT now()); INSERT INTO backup_restore_sentinel (id) VALUES ('backup-drill') ON CONFLICT (id) DO NOTHING;"

      - name: Create verifiable PostgreSQL backup
        run: pnpm db:backup -- ./artifacts/database/ci.dump

      - name: Restore backup into isolated database
        run: pnpm db:restore:drill -- ./artifacts/database/ci.dump

      - name: Exercise external backup roundtrip contract
        shell: bash
        env:
          BACKUP_FAKE_REMOTE_DIR: ${{ github.workspace }}/artifacts/fake-remote
          BACKUP_ID: ci-external-backup
          BACKUP_OUTPUT_DIR: ${{ github.workspace }}/artifacts/database/external
          BACKUP_REMOTE_PREFIX: oes-production
          BACKUP_REMOTE_RESTORE_DIR: ${{ github.workspace }}/artifacts/database/remote-restore
          BACKUP_RETENTION_DAYS: '30'
          BACKUP_TRANSPORT_EXECUTABLE: ${{ github.workspace }}/scripts/database/test/fake-backup-transport.sh
        run: |
          chmod +x "$BACKUP_TRANSPORT_EXECUTABLE"
          pnpm db:backup:roundtrip-drill
          test "$(wc -l < "$BACKUP_FAKE_REMOTE_DIR/uploads.log")" -eq 3
          test "$(wc -l < "$BACKUP_FAKE_REMOTE_DIR/downloads.log")" -eq 3
          grep -Fx 'oes-production 30' "$BACKUP_FAKE_REMOTE_DIR/retention.log"
          test -f "$BACKUP_FAKE_REMOTE_DIR/oes-production/ci-external-backup.dump"
          test -f "$BACKUP_FAKE_REMOTE_DIR/oes-production/ci-external-backup.dump.sha256"
          MANIFEST="$BACKUP_FAKE_REMOTE_DIR/oes-production/ci-external-backup.manifest.json"
          test -f "$MANIFEST"
          grep -F '"schemaVersion": "oes-backup-manifest-v1"' "$MANIFEST"
          grep -F '"retentionDays": 30' "$MANIFEST"
          ! grep -F 'DATABASE_URL' "$MANIFEST"
          ! grep -F 'localhost' "$MANIFEST"
          (cd "$(dirname "$MANIFEST")" && sha256sum --check ci-external-backup.dump.sha256)

      - name: Test with coverage
        run: pnpm coverage

      - name: Build
        run: pnpm build

  visual-e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://oes:oes@localhost:5432/oes?schema=public
      E2E_SCREENSHOT_DIR: artifacts/visual-e2e
      E2E_SUPERADMIN_EMAIL: e2e-superadmin@oes.test
      E2E_SUPERADMIN_PASSWORD: e2e-superadmin-password-2026
      E2E_WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oes
          POSTGRES_PASSWORD: oes
          POSTGRES_USER: oes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oes -d oes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare E2E environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://oes:oes@localhost:5432/oes?schema=public
          API_PORT=3001
          SESSION_ABSOLUTE_MINUTES=720
          SESSION_IDLE_MINUTES=30
          WEB_ORIGIN=http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/api/v1
          EOF
          pnpm db:migrate:deploy

      - name: Bootstrap E2E superadmin
        env:
          OES_BOOTSTRAP_DISPLAY_NAME: E2E Superadmin
          OES_BOOTSTRAP_EMAIL: e2e-superadmin@oes.test
          OES_BOOTSTRAP_PASSWORD: e2e-superadmin-password-2026
        run: pnpm --filter @oes/api bootstrap:superadmin

      - name: Seed competition detail fixture
        shell: bash
        run: |
          LIBPQ_URL="${DATABASE_URL%%\?*}"
          docker run --rm --network host -v "${{ github.workspace }}:/workspace:ro" postgres:17-alpine \
            psql "$LIBPQ_URL" --file=/workspace/.github/e2e/seed-competition-detail.sql
          docker run --rm --network host -v "${{ github.workspace }}:/workspace:ro" postgres:17-alpine \
            psql "$LIBPQ_URL" --file=/workspace/.github/e2e/seed-general-championship.sql

      - name: Build application for browser drill
        run: pnpm build

      - name: Install pinned browser runner
        shell: bash
        run: |
          pnpm add -Dw --lockfile=false --ignore-scripts playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start API and web
        shell: bash
        run: |
          pnpm --filter @oes/api start > /tmp/oes-api.log 2>&1 &
          echo $! > /tmp/oes-api.pid
          pnpm --filter @oes/web start > /tmp/oes-web.log 2>&1 &
          echo $! > /tmp/oes-web.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null && curl --silent http://127.0.0.1:3001/api/v1/auth/me > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oes-api.log
          cat /tmp/oes-web.log
          exit 1

      - name: Exercise responsive workspace in Chromium
        run: |
          node .github/e2e/admin-responsive.mjs
          node .github/e2e/general-championship-responsive.mjs

      - name: Upload visual E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: visual-e2e-screenshots
          path: artifacts/visual-e2e

      - name: Stop API and web
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/oes-api.pid || kill "$(cat /tmp/oes-api.pid)" 2>/dev/null || true
          test ! -f /tmp/oes-web.pid || kill "$(cat /tmp/oes-web.pid)" 2>/dev/null || true
