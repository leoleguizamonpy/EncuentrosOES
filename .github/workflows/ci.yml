name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://oes:oes@localhost:5432/oes?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oes
          POSTGRES_PASSWORD: oes
          POSTGRES_USER: oes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oes -d oes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: git diff --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate database schema
        run: pnpm db:validate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Test PostgreSQL integration
        run: pnpm test:integration

      - name: Test with coverage
        run: pnpm coverage

      - name: Build
        run: pnpm build
