name: One-shot competition store delegation

on:
  push:
    branches:
      - refactor/competition-store-delegation
    paths:
      - .github/workflows/one-shot-competition-store-delegation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/competition-store-delegation
      - name: Apply exact delegation refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/competitions/prisma-competition-store.ts')
          text = path.read_text()

          old_import = "import { type Prisma, type PrismaClient } from '@oes/database';"
          new_import = "import { PrismaCompetitionRepository, type Prisma, type PrismaClient } from '@oes/database';"
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_ctor = "export class PrismaCompetitionStore implements CompetitionStore {\n  public constructor(@Inject(PRISMA_CLIENT) private readonly client: PrismaClient) {}"
          new_ctor = "export class PrismaCompetitionStore implements CompetitionStore {\n  readonly #competitionRepository: PrismaCompetitionRepository;\n\n  public constructor(@Inject(PRISMA_CLIENT) private readonly client: PrismaClient) {\n    this.#competitionRepository = new PrismaCompetitionRepository(client);\n  }"
          assert old_ctor in text
          text = text.replace(old_ctor, new_ctor, 1)

          old_add_write = """        const snapshot = aggregate.toSnapshot();
        const updated = await transaction.competition.updateMany({
          data: {
            formatCode: snapshot.formatCode,
            groupCount: snapshot.groupCount,
            revision: snapshot.revision,
            updatedAt: snapshot.updatedAt,
            updatedById: snapshot.updatedBy,
          },
          where: { id: snapshot.id, revision: input.expectedRevision },
        });
        if (updated.count !== 1) {
          throw new CompetitionStoreError('CONCURRENCY_CONFLICT', 'The competition was modified by another operation.');
        }
        const participant = snapshot.participants.find(({ id }) => id === participantId);
        if (participant === undefined) throw new Error('Participant mutation did not produce a snapshot.');
        await transaction.competitionParticipant.create({
          data: {
            competitionId: snapshot.id,
            displayName: participant.displayName,
            enabledAt: participant.enabledAt,
            enabledById: participant.enabledBy,
            eventId: participant.eventId,
            id: participant.id,
            institutionId: participant.institutionId,
            revision: participant.revision,
            status: participant.status,
          },
        });
"""
          new_add_write = """        try {
          await this.#competitionRepository.saveInTransaction(
            transaction,
            aggregate,
            input.expectedRevision,
          );
        } catch (error: unknown) {
          if (error instanceof DomainError) throw storeError(error);
          throw error;
        }
        const snapshot = aggregate.toSnapshot();
"""
          assert old_add_write in text
          text = text.replace(old_add_write, new_add_write, 1)

          old_format_write = """        const snapshot = aggregate.toSnapshot();
        const updated = await transaction.competition.updateMany({
          data: {
            formatCode: snapshot.formatCode,
            groupCount: snapshot.groupCount,
            revision: snapshot.revision,
            updatedAt: snapshot.updatedAt,
            updatedById: snapshot.updatedBy,
          },
          where: { id: snapshot.id, revision: input.expectedRevision },
        });
        if (updated.count !== 1) {
          throw new CompetitionStoreError('CONCURRENCY_CONFLICT', 'The competition was modified by another operation.');
        }
"""
          new_format_write = """        try {
          await this.#competitionRepository.saveInTransaction(
            transaction,
            aggregate,
            input.expectedRevision,
          );
        } catch (error: unknown) {
          if (error instanceof DomainError) throw storeError(error);
          throw error;
        }
        const snapshot = aggregate.toSnapshot();
"""
          assert old_format_write in text
          text = text.replace(old_format_write, new_format_write, 1)

          start = text.index('  async #aggregate(transaction: Prisma.TransactionClient, id: string): Promise<Competition> {')
          end = text.index('\n\n  async #detail(', start)
          new_aggregate = """  async #aggregate(transaction: Prisma.TransactionClient, id: string): Promise<Competition> {
    const aggregate = await this.#competitionRepository.findByIdInTransaction(transaction, id);
    if (aggregate === null) {
      throw new CompetitionStoreError('COMPETITION_NOT_FOUND', 'The competition does not exist.');
    }
    return aggregate;
  }"""
          text = text[:start] + new_aggregate + text[end:]

          path.write_text(text)
          PY

          git diff --check
          git diff -- apps/api/src/competitions/prisma-competition-store.ts
          git rm .github/workflows/one-shot-competition-store-delegation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/src/competitions/prisma-competition-store.ts
          git commit -m "refactor(api): delegate competition aggregate persistence"
          git push origin HEAD:refactor/competition-store-delegation
