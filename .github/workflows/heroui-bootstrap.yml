name: HeroUI Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/heroui-bootstrap.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install current dependencies
        run: pnpm install --frozen-lockfile

      - name: Add HeroUI v3 and Tailwind v4
        run: |
          pnpm --filter @oes/web add @heroui/react@3.2.4 @heroui/styles@3.2.4
          pnpm --filter @oes/web add -D tailwindcss@4.2.2 @tailwindcss/postcss@4.2.2

      - name: Commit dependency lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "HeroUI dependencies already installed."
            exit 0
          fi
          git commit -m "build(web): install HeroUI v3 visual foundation"
          git push origin HEAD:main
